# Portable Linux development gate. No host mounts or publishing credentials.
labels:
  platform: linux/amd64
  backend: docker
clone:
  git:
    image: docker.io/woodpeckerci/plugin-git@sha256:9802cb7852dcf31f9c5c1d1ddeadfb9002d4fae85751f7b6a792eedb267bcc59
    settings:
      depth: 0
      partial: false
when:
  - event: push
    branch: main
  - event:
      - pull_request
      - manual
steps:
  - name: development-environment
    image: docker.io/nixos/nix:2.35.4@sha256:f159a58f390677f41e8e900a74b6e2f9c7f27b364122ae6acf7a652ce6c551c0
    environment:
      CI: 'true'
      NIX_CONFIG: |-
        experimental-features = nix-command flakes
        sandbox = false
        build-users-group = nixbld
        max-jobs = 1
        cores = 2
        extra-substituters = https://devenv.cachix.org
        extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
    commands:
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - nix run --accept-flake-config github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222 -- test

  - name: test-python-3-11
    image: docker.io/library/python:3.11-slim-trixie@sha256:65bd3d9f1d7fa268dd1909973ba7eb4bdf41f6dcf2cfbe76ba9528b170f3fd79
    environment:
      DEBIAN_FRONTEND: noninteractive
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends ca-certificates git make shellcheck libarchive-tools
      - bash scripts/ci/check-python.sh 3.11

  - name: test-python-3-14
    image: docker.io/library/python:3.14-slim-trixie@sha256:af8a5aa14780025dbfbcfbc81bd8a91ebd87711dd5b0f48ed71090949dd7cb1d
    environment:
      DEBIAN_FRONTEND: noninteractive
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends ca-certificates git make shellcheck libarchive-tools
      - bash scripts/ci/check-python.sh 3.14

  - name: source-and-workflow-policy
    image: docker.io/library/node:24-trixie-slim@sha256:0820eaa85e07d0490446dd01d14707e17e6108a36988cf374899cd057eb3812d
    environment:
      DEBIAN_FRONTEND: noninteractive
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends ca-certificates curl git python3 python3-venv shellcheck
      - bash scripts/ci/check-policy.sh
