name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 12 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@751276eafca55f10f252026015f43c488f2322ba
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck make libarchive-tools
      - name: Require native archive test backend
        run: |
          bsdtar --version
          python -c "import ctypes.util; assert ctypes.util.find_library('archive')"
      - name: Check code and generated documentation
        run: make check
      - name: Run disposable-fixture tests
        run: |
          set -o pipefail
          make test-all 2>&1 | tee test-results.txt
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results-${{ matrix.python }}
          path: test-results.txt
          if-no-files-found: warn

  workflow-security:
    name: Workflow security
    permissions:
      contents: read
    uses: bolens/.github/.github/workflows/reusable-actionlint.yml@2e99e898d79a0921d59447073418d9dcd36320e3
    with:
      security-audit: true
