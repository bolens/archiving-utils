name: Development environment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: devenv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.paths.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Push comparisons must be local after checkout removes credentials.
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: paths
        with:
          filters: |
            environment:
              - 'devenv.*'
              - '.devcontainer/**'
              - '.github/workflows/devenv.yml'
              - 'Makefile'
              - 'bin/**'
              - 'lib/**'
              - 'mcp/**'
              - 'conversion/**'
              - 'util/**'
              - 'scripts/**'
              - 'tests/**'
              - 'docs/**'
              - '.specify/**'
              - '.agents/**'
              - 'site/**'
              - '*.md'
              - 'VERSION'

  validate:
    name: devenv (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.environment == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
      - name: Install pinned devenv
        run: nix profile install github:cachix/devenv/42246161fa3bf7cd18f8334d08c73d6aaa8762d3
      - name: Validate native development environment
        run: devenv test
      - name: Validate Docker development image
        if: runner.os == 'Linux'
        run: |
          python3 scripts/development-container.py build docker
          python3 scripts/development-container.py run docker -- make check test-all
      - name: Validate VS Code devcontainer image
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Match updateRemoteUserUID without changing checkout ownership.
          test "$(id -u)" -ne 0
          docker build --pull --tag archiving-utils-devcontainer:ci .devcontainer
          docker run --rm --network=none --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,size=67108864,mode=1777 \
            --env HOME=/tmp --env XDG_CONFIG_HOME=/tmp/config \
            --env XDG_CACHE_HOME=/tmp/cache --env XDG_STATE_HOME=/tmp/state \
            --mount "type=bind,source=$PWD,target=/workspace" \
            --workdir /workspace archiving-utils-devcontainer:ci \
            bash .devcontainer/post-create.sh

  result:
    name: Development environment
    if: always()
    needs: [changes, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected environment checks
        env:
          CHANGES: ${{ needs.changes.result }}
          VALIDATE: ${{ needs.validate.result }}
        run: |
          test "$CHANGES" = success
          case "$VALIDATE" in success|skipped) ;; *) exit 1 ;; esac
